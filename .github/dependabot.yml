# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      # @vitest/coverage-v8 pins the exact vitest version, so the two must bump in one PR
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      # react-dom and the @types packages each need the matching react major, so they bump together
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # The plugin requires a parser of the same minor version, so they bump together
      typescript-eslint:
        patterns:
          - "@typescript-eslint/*"
      # Every other minor and patch update lands in one weekly PR. A package goes to the first group it
      # matches, so the groups above keep their majors; any other major still gets its own PR.
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # The @types/node major follows the Node version CI runs on (22): newer types would allow APIs
      # the runtime lacks. Raise it together with `node-version` in .github/workflows/ci.yml.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

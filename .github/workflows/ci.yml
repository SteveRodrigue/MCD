name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check changelog fragments
        run: |
          npm run changelog:check
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE="HEAD~1"
            fi
          fi
          if git rev-parse --verify "$BASE" >/dev/null 2>&1; then
            SRC_CHANGES=$(git diff --name-only "$BASE" HEAD -- 'src/')
            if [ -n "$SRC_CHANGES" ]; then
              FRAGMENTS=$(git diff --name-only --diff-filter=A "$BASE" HEAD -- 'changes/unreleased/*.md')
              if [ -z "$FRAGMENTS" ]; then
                echo "Error: Changes to src/ require a new changelog fragment in changes/unreleased/ (decision 2B)."
                exit 1
              fi
            fi
          fi

      - name: Leak guard
        run: npm run leak:check

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  # Four shards of about equal run time (tools/test-shards.ts); test-merge combines their reports.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage (shard ${{ matrix.shard }}/4)
        run: npx vitest run --coverage --shard=${{ matrix.shard }}/4 --reporter=default --reporter=blob

      - name: Upload shard report
        uses: actions/upload-artifact@v4
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest/blob/
          include-hidden-files: true
          retention-days: 1

  # Coverage thresholds apply to the whole suite, so they are checked on the merged shard reports.
  test-merge:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: vitest-blob-*
          path: .vitest/blob
          merge-multiple: true

      - name: Merge reports and check coverage
        run: npx vitest run --merge-reports --coverage --reporter=default --reporter=json --outputFile=.vitest/timings.json

      # The shard count matches the test matrix above
      - name: Check shard balance
        run: npx tsx tools/test-shards.ts check .vitest/timings.json 4

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web Bundle
        run: npm run build

  # Stable required-check name (branch protection) that gates on the parallel jobs above.
  build-and-test:
    if: ${{ always() }}
    needs: [static-checks, test-merge, build]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs passed
        run: |
          [ "${{ needs.static-checks.result }}" = "success" ] &&
          [ "${{ needs.test-merge.result }}" = "success" ] &&
          [ "${{ needs.build.result }}" = "success" ]

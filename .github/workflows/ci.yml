name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check changelog fragments
        run: |
          npm run changelog:check
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE="HEAD~1"
            fi
          fi
          if git rev-parse --verify "$BASE" >/dev/null 2>&1; then
            SRC_CHANGES=$(git diff --name-only "$BASE" HEAD -- 'src/')
            if [ -n "$SRC_CHANGES" ]; then
              FRAGMENTS=$(git diff --name-only --diff-filter=A "$BASE" HEAD -- 'changes/unreleased/*.md')
              if [ -z "$FRAGMENTS" ]; then
                echo "Error: Changes to src/ require a new changelog fragment in changes/unreleased/ (decision 2B)."
                exit 1
              fi
            fi
          fi

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

      - name: Run Coverage
        run: npm run test:coverage

      - name: Build Web Bundle
        run: npm run build

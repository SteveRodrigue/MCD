name: Upstream data sync check

# Weekly read-only check that content/ still matches zzorba/marvelsdb-json-data (ADR-0006).
# It never writes to content/: a difference opens (or updates) one issue for a maintainer to
# review, and the sync itself stays a manual `npm run content:sync`.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-sync-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check content against upstream
        id: sync
        run: |
          set +e
          npm run content:sync -- --check 2>&1 | tee sync-report.txt
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "diff=false" >> "$GITHUB_OUTPUT"
          elif grep -q '^Would write' sync-report.txt; then
            # The check ran and found differences (exit 1 with the summary line).
            echo "diff=true" >> "$GITHUB_OUTPUT"
          else
            echo "The sync check itself failed (download or parse error)."
            exit "$status"
          fi

      - name: Open or update the out-of-sync issue
        if: steps.sync.outputs.diff == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          label="upstream-sync"
          gh label create "$label" --color FBCA04 \
            --description "content/ differs from zzorba/marvelsdb-json-data" 2>/dev/null || true
          {
            echo "The weekly check found differences between \`content/\` and upstream \`zzorba/marvelsdb-json-data\`."
            echo
            echo "Review them, then run \`npm run content:sync\` locally and commit what you accept. This check never changes \`content/\` (ADR-0006)."
            echo
            echo "Run: $RUN_URL"
            echo
            echo '```text'
            head -c 50000 sync-report.txt
            echo '```'
          } > issue-body.md
          existing=$(gh issue list --label "$label" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file issue-body.md
          else
            gh issue create --label "$label" \
              --title "Upstream card data is out of sync" --body-file issue-body.md
          fi
